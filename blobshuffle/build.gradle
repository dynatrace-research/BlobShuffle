plugins {
    id 'java'
    id "application"
    id 'com.google.cloud.tools.jib' version '3.4.5'
}

application {
    mainClassName = "com.dynatrace.research.blobshuffle.kstreams.KafkaStreamsBlobShuffleExample"
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(25))
    }
    withJavadocJar()
    withSourcesJar()
}

group = 'com.dynatrace'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'io.micrometer:micrometer-registry-prometheus:1.15.3'
    implementation 'org.apache.kafka:kafka-clients:3.9.0'
    implementation 'org.apache.kafka:kafka-streams:3.9.0'
    implementation 'software.amazon.awssdk:s3:2.29.0'
    implementation 'software.amazon.awssdk:sts:2.29.0'
    implementation 'software.amazon.awssdk:apache5-client:2.32.0-PREVIEW'
    //implementation 'software.amazon.awssdk:apache5-client:2.41.0' // Upgrade whenever possible
    implementation 'org.jgroups:jgroups:5.5.4.Final'
    implementation ('io.javalin:javalin:6.7.0') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    implementation 'org.apache.logging.log4j:log4j-api:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'
    implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.24.3'
    implementation 'io.smallrye.config:smallrye-config:3.11.4'
    implementation 'com.dynatrace.hash4j:hash4j:0.11.0'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.9.1'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.9.1'
    //testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.23.1'
    //testImplementation group: 'org.hipparchus', name: 'hipparchus-stat', version: '2.3'
    testImplementation "org.testcontainers:junit-jupiter:1.20.5"
    testImplementation "org.testcontainers:localstack:1.20.5"
    testImplementation "org.testcontainers:kafka:1.20.5"
    testImplementation 'org.awaitility:awaitility:4.2.2'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation "org.mockito:mockito-core:5.+"

}

test {
    useJUnitPlatform()
}

jib {
    from {
        image = "eclipse-temurin:25-jre"
        platforms {
            platform {
                architecture = "amd64"
                os = "linux"
            }
            platform {
                architecture = "arm64"
                os = "linux"
            }
        }
    }
    to {
        // image = ${imageRepository}/${project.name}:${imageTag}
        image = [[imageRepository, project.name].join('/'), imageTag].join(':')
        if (project.hasProperty('imageCredHelper')) {
            credHelper = imageCredHelper
        }
        if (project.hasProperty('imageUsername') && project.hasProperty('imagePassword')) {
            auth {
                username = imageUsername
                password = imagePassword
            }
        }
    }
    container.mainClass = application.getMainClass().get()
}
