  loadTypes:
    - typeName: "MessagesPerSecond"
      patchers:
        - type: "EnvVarPatcher"
          resource: "shuffle-load-generator-deployment.yaml"
          properties:
            container: "shuffle-load-generator"
            variableName: "NUM_RECORDS_PER_SOURCE_SECOND"
    - typeName: "BatchDesiredBytes"
      patchers:
        - type: "EnvVarPatcher"
          resource: "blobshuffle-deployment.yaml"
          properties:
            container: "blobshuffle"
            variableName: "BATCH_DESIRED_BYTES"
  slos:
    - name: "lag trend"
      sloType: "lag trend"
      prometheusUrl: "http://prometheus-operated:9090"
      offset: 0
      properties:
        consumerGroup: blobshuffle-kstreams
        thresholdRelToLoad: 0.01
        externalSloUrl: "http://localhost:80/evaluate-slope"
        warmup: 120 # in seconds
    # Normal, "read-only" metrics:
    - name: "throughput"
      sloType: generic
      prometheusUrl: "http://prometheus-operated:9090"
      offset: 0
      properties:
        externalSloUrl: "http://localhost:8082"
        promQLQuery: "sum by (topic) (rate(kafka_server_brokertopicmetrics_messagesin_total{topic='output'}[20s])) >= 0"
        queryAggregation: mean
        repetitionAggregation: median
        operator: "true"
        threshold: 0
        warmup: 120 # in seconds
    - name: "output_throughput"
      sloType: generic
      prometheusUrl: "http://prometheus-operated:9090"
      offset: 0
      properties:
        externalSloUrl: "http://localhost:8082"
        promQLQuery: "sum by (topic) (rate(kafka_server_brokertopicmetrics_messagesin_total{topic='output'}[20s]))"
        queryAggregation: mean
        repetitionAggregation: median
        operator: "true"
        threshold: 0
        warmup: 120 # in seconds
    - name: "latency_p00"
      sloType: generic
      prometheusUrl: "http://prometheus-operated:9090"
      offset: 0
      properties:
        externalSloUrl: "http://localhost:8082"
        promQLQuery: "histogram_quantile(0.00, sum(rate(blobshuffle_latency_seconds_bucket[20s])) by (le))"
        queryAggregation: mean
        repetitionAggregation: median
        operator: "true"
        threshold: 0
        warmup: 120 # in seconds
