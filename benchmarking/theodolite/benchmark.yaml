apiVersion: theodolite.rocks/v1beta1
kind: benchmark
metadata:
  name: blobshuffle
spec:
  sut:
    resources:
      - configMap:
          name: blobshuffle-resources
          files:
          - "input-topic.yaml"
          - "notifications-repartition-topic.yaml"
          - "output-topic.yaml"
          - "blobshuffle-deployment.yaml"
          - "blobshuffle-jgroups-service.yaml"
          - "blobshuffle-jmx-configmap.yaml"
          #- "blobshuffle-rbac.yaml"
          - "blobshuffle-service-monitor.yaml"
          - "blobshuffle-service.yaml"
  loadGenerator:
    resources:
      - configMap:
          name: blobshuffle-load-generator-resources
          files:
          - "shuffle-load-generator-service.yaml"
          - "shuffle-load-generator-deployment.yaml"
  resourceTypes:
    - typeName: "Instances"
      patchers:
        - type: "ReplicaPatcher"
          resource: "blobshuffle-deployment.yaml"
        - type: GenericResourcePatcher
          resource: "input-topic.yaml"
          properties:
            path: "spec/partitions"
            type: integer
            factor: 9
        - type: GenericResourcePatcher
          resource: "notifications-repartition-topic.yaml"
          properties:
            path: "spec/partitions"
            type: integer
            factor: 9
        - type: GenericResourcePatcher
          resource: "output-topic.yaml"
          properties:
            path: "spec/partitions"
            type: integer
            factor: 9
    - typeName: "Instances-x3Partitions"
