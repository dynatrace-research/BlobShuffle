apiVersion: theodolite.rocks/v1beta1
kind: execution
metadata:
  name: blobshuffle-nodes-21-instances-42
spec:
  benchmark: blobshuffle
  load:
    loadType: "BatchDesiredBytes"
    loadValues: [16777216] # 16MB
  resources:
    resourceType: "Instances"
    resourceValues: [42]
  slos:
    - name: throughput
      properties: {}
  execution:
    metric: capacity
    strategy:
      name: "FullSearch"
    duration: 900 # in seconds
    loadGenerationDelay: 30 # in seconds
    repetitions: 1
  configOverrides:
    - patcher:
        type: "NodeSelectorPatcher"
        resource: "blobshuffle-deployment.yaml"
        properties:
          variableName: "nodegroup-size-21"
      value: "true"
