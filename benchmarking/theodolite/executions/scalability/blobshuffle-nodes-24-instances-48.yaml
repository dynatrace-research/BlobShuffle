apiVersion: theodolite.rocks/v1beta1
kind: execution
metadata:
  name: blobshuffle-nodes-24-instances-48
spec:
  benchmark: blobshuffle
  load:
    loadType: "BatchDesiredBytes"
    loadValues: [16777216] # 16MB
  resources:
    resourceType: "Instances"
    resourceValues: [48]
  slos:
    - name: throughput
      properties: {}
  execution:
    metric: capacity
    strategy:
      name: "FullSearch"
    duration: 1200 # in seconds
    loadGenerationDelay: 30 # in seconds
    repetitions: 3
  configOverrides:
    - patcher:
        type: "NodeSelectorPatcher"
        resource: "blobshuffle-deployment.yaml"
        properties:
          variableName: "nodegroup-size-24"
      value: "true"
    - patcher:
        type: "EnvVarPatcher"
        resource: "blobshuffle-deployment.yaml"
        properties:
          container: "blobshuffle"
          variableName: "KAFKASTREAMS__SESSION_TIMEOUT_MS__"
      value: "360000"
    - patcher:
        type: "EnvVarPatcher"
        resource: "blobshuffle-deployment.yaml"
        properties:
          container: "blobshuffle"
          variableName: "KAFKASTREAMS__REQUEST_TIMEOUT_MS__"
      value: "360000"
    - patcher:
        type: "EnvVarPatcher"
        resource: "blobshuffle-deployment.yaml"
        properties:
          container: "blobshuffle"
          variableName: "KAFKASTREAMS__MAX_POLL_INTERVAL_MS__"
      value: "600000"
