apiVersion: theodolite.rocks/v1beta1
kind: execution
metadata:
  name: blobshuffle-instances-24-nodes-12
spec:
  benchmark: blobshuffle
  load:
    loadType: "BatchDesiredBytes"
    loadValues: [1048576, 2097152, 4194304, 8388608, 16777216, 33554432, 67108864, 134217728] # 1MB, 2MB, 4MB, 8MB, 16MB, 32MB, 64MB, 128MB
  resources:
    resourceType: "Instances"
    resourceValues: [24]
  slos:
    - name: throughput
      properties: {}
  execution:
    metric: capacity
    strategy:
      name: "FullSearch"
    duration: 900 # in seconds
    loadGenerationDelay: 30 # in seconds
    repetitions: 3
  configOverrides:
    - patcher:
        type: "NodeSelectorPatcher"
        resource: "blobshuffle-deployment.yaml"
        properties:
          variableName: "nodegroup-size-12"
      value: "true"
