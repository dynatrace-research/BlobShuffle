apiVersion: theodolite.rocks/v1beta1
kind: execution
metadata:
  name: s3shuffler-instances-6-nodes-3-komihash4-3
spec:
  benchmark: s3shuffler
  load:
    loadType: "BatchDesiredBytes"
    loadValues: [16777216] # 16MB
  resources:
    resourceType: "Instances"
    resourceValues: [6]
  slos:
    - name: throughput
      properties: {}
  execution:
    metric: capacity
    strategy:
      name: "FullSearch"
    duration: 600 # in seconds
    loadGenerationDelay: 30 # in seconds
    repetitions: 1
  configOverrides:
    - patcher:
        type: "NodeSelectorPatcher"
        resource: "s3shuffler-deployment.yaml"
        properties:
          variableName: "nodegroup-size-3"
      value: "true"
    - patcher:
        type: "EnvVarPatcher"
        resource: "s3shuffler-deployment.yaml"
        properties:
          container: "s3-shuffler"
          variableName: "PARTITIONER"
      value: "KOMIHASH4_3"
