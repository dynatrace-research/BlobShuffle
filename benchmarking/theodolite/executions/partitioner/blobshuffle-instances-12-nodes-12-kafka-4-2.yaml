apiVersion: theodolite.rocks/v1beta1
kind: execution
metadata:
  name: blobshuffle-instances-12-nodes-12-kafka-4-2
spec:
  benchmark: blobshuffle
  load:
    loadType: "BatchDesiredBytes"
    loadValues: [16777216] # 16MB
  resources:
    resourceType: "Instances"
    resourceValues: [12]
  slos:
    - name: throughput
      properties: {}
  execution:
    metric: capacity
    strategy:
      name: "FullSearch"
    duration: 900 # in seconds
    loadGenerationDelay: 30 # in seconds
    repetitions: 1
  configOverrides:
    - patcher:
        type: "NodeSelectorPatcher"
        resource: "blobshuffle-deployment.yaml"
        properties:
          variableName: "nodegroup-size-12"
      value: "true"
    - patcher:
        type: "EnvVarPatcher"
        resource: "blobshuffle-deployment.yaml"
        properties:
          container: "blobshuffle"
          variableName: "PARTITIONER"
      value: "KAFKA_4_2"
