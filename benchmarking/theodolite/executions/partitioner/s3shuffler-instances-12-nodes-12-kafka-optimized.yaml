apiVersion: theodolite.rocks/v1beta1
kind: execution
metadata:
  name: s3shuffler-instances-12-nodes-12-kafka-optimized
spec:
  benchmark: s3shuffler
  load:
    loadType: "BatchDesiredBytes"
    loadValues: [16777216] # 16MB
  resources:
    resourceType: "Instances"
    resourceValues: [12]
  slos:
    - name: throughput
      properties: {}
  execution:
    metric: capacity
    strategy:
      name: "FullSearch"
    duration: 900 # in seconds
    loadGenerationDelay: 30 # in seconds
    repetitions: 1
  configOverrides:
    - patcher:
        type: "NodeSelectorPatcher"
        resource: "s3shuffler-deployment.yaml"
        properties:
          variableName: "nodegroup-size-12"
      value: "true"
    - patcher:
        type: "EnvVarPatcher"
        resource: "s3shuffler-deployment.yaml"
        properties:
          container: "s3-shuffler"
          variableName: "PARTITIONER"
      value: "KAFKA_OPTIMIZED"
