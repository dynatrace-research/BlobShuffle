apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: shuffle-load-generator
spec:
  serviceName: "shuffle-load-generator"
  selector:
    matchLabels:
      app: shuffle-load-generator
  replicas: 12
  template:
    metadata:
      labels:
        app: shuffle-load-generator
    spec:
      terminationGracePeriodSeconds: 0
      containers:
        - name: shuffle-load-generator
          image: ghcr.io/dynatrace-research/shufflebench/load-generator:latest
          env:
            - name: SEED_STRING
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "theodolite-kafka-kafka-bootstrap:9092"
            - name: THREAD_POOL_SIZE
              value: "4"
            - name: NUM_SOURCES
              value: "1"
            - name: SHARE_KAFKA_PRODUCER_AMONG_SOURCES
              value: "false"
            - name: NUM_RECORDS_PER_SOURCE_SECOND
              # Records per second per load-generator pod.
              # Total load = replicas × NUM_RECORDS_PER_SOURCE_SECOND × RECORD_SIZE_BYTES.
              # 180,000 rec/s × 1 KB × 12 pods ≈ 2.2 GiB/s total.
              # Theodolite sweeps this via the MessagesPerSecond load type.
              value: "180000"
            - name: RECORD_SIZE_BYTES
              value: "1024"
      nodeSelector:
        type: infra
