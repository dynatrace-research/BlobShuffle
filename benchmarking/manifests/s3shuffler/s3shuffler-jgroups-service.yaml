apiVersion: v1
kind: Service
metadata:
  annotations:
    service.alpha.kubernetes.io/tolerate-unready-endpoints: "true"
  name: s3shuffler-jgroups
  labels:
    app: s3shuffler
spec:
  publishNotReadyAddresses: true
  clusterIP: None
  selector:
    app: s3shuffler
  ports:
    - name: ping
      port: 7800
      protocol: TCP
      targetPort: 7800
