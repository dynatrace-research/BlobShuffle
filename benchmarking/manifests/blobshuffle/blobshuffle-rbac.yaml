apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blobshuffle-node-metadata-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blobshuffle-node-metadata-reader-binding
subjects:
  - kind: ServiceAccount
    name: blobshuffle-s3
    namespace: default
roleRef:
  kind: ClusterRole
  name: blobshuffle-node-metadata-reader
  apiGroup: rbac.authorization.k8s.io
