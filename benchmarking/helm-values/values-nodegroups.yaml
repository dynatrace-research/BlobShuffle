kafkaClient:
  nodeSelector:
    type: infra

kcat:
  nodeSelector:
    type: infra

strimzi-kafka-operator:
  nodeSelector:
    type: infra

strimzi:
  kafka:
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: type
                  operator: In
                  values:
                  - kafka
        topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/name: theodolite-kafka-kafka
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              strimzi.io/name: theodolite-kafka-kafka

  zookeeper:
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: type
                  operator: In
                  values:
                  - infra
  topicOperator:
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: type
                  operator: In
                  values:
                  - infra
  kafkaExporter:
    template:
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: type
                  operator: In
                  values:
                  - infra

kube-prometheus-stack:
  prometheusOperator:
    nodeSelector:
      type: infra
  grafana:
    nodeSelector:
      type: infra
  prometheus:
    prometheusSpec:
      nodeSelector:
        type: infra
  kube-state-metrics:
    nodeSelector:
      type: infra

prometheus: 
  nodeSelector:
    type: infra

operator:
  nodeSelector:
    type: infra
